name: Backend CI – Test, Scan, Build, Push

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
    ################################
    # CHECKOUT
    ################################
    - name: Checkout code
      uses: actions/checkout@v4

    ################################
    # NODE SETUP
    ################################
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: npm

    ################################
    # INSTALL & TEST
    ################################
    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    ################################
    # DEPENDENCY SCAN
    ################################
    - name: Dependency vulnerability scan
      run: npm audit --audit-level=high

    ################################
    # DOCKER LOGIN
    ################################
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    ################################
    # DOCKER BUILD
    ################################
    - name: Build Docker image
      run: |
        docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/vst-home-backend:${{ github.run_number }} \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/vst-home-backend:latest \
          .

    ################################
    # IMAGE SECURITY SCAN
    ################################
    - name: Trivy image scan
      uses: aquasecurity/trivy-action@0.20.0
      with:
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/vst-home-backend:${{ github.run_number }}
        exit-code: 0
        ignore-unfixed: true

    ################################
    # PUSH IMAGE
    ################################
    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/vst-home-backend:${{ github.run_number }}
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/vst-home-backend:latest
